services:
  # ─── Backend Service ──────────────────────────────────────────────────────────
  - type: web
    name: college-management-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        value: mongodb+srv://admin:admin82945@collegemanagement.oj2meyf.mongodb.net/?appName=CollegeManagement
      - key: JWT_SECRET
        value: 95e53834944eb361b42b01a53c356242531ed08c2baf3016390bcd629994893e8dc5d20da24b49660f41ce44975cd0580ba17acd736868d7e8920ef6f176fd11
      - key: JWT_REFRESH_SECRET
        value: 2f9d13a9105c77eebe7f4a9265e20c29dfa31594f377757d12a0b46d4d164ec95cc6187a121132de8f473afec1cf08fd1fcf8a7990c6e04ff22bb8af4a3fa2a1
      - key: JWT_EXPIRE
        value: 24h
      - key: JWT_REFRESH_EXPIRE
        value: 7d
      - key: ENCRYPTION_KEY
        value: 7948e4e05bbfb2201df5bfa6f8eb8d18888000d1eb28109a83316aee0eb00d1a
      - key: FRONTEND_URL
        value: https://college-management-frontend.onrender.com
      - key: LOG_LEVEL
        value: info

  # ─── Frontend Service ─────────────────────────────────────────────────────────
  - type: web
    name: college-management-frontend
    env: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://college-management-system-backend-e4ki.onrender.com/api/v1
