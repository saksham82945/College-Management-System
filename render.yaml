services:
  # ─── Backend Service ──────────────────────────────────────────────────────────
  - type: web
    name: college-management-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false   # ⚠️ Set in Render Dashboard only — never hardcode secrets
      - key: JWT_SECRET
        sync: false   # ⚠️ Set in Render Dashboard only
      - key: JWT_REFRESH_SECRET
        sync: false   # ⚠️ Set in Render Dashboard only
      - key: JWT_EXPIRE
        value: 24h
      - key: JWT_REFRESH_EXPIRE
        value: 7d
      - key: ENCRYPTION_KEY
        sync: false   # ⚠️ Set in Render Dashboard only
      - key: FRONTEND_URL
        value: https://college-management-frontend.onrender.com
      - key: LOG_LEVEL
        value: info

  # ─── Frontend Service ─────────────────────────────────────────────────────────
  - type: web
    name: college-management-frontend
    env: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://college-management-system-backend-e4ki.onrender.com/api/v1
